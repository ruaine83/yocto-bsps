sites:
  local:
    description: "Env on local machine"
    conf: |
      INHERIT += "rm_work"
      PREFERRED_VERSION_tpm2-tss-engine = "1.2.0"
      BBMASK += "recipes-tpm2/tpm2-tss-engine/tpm2-tss-engine_1.1.0.bb"
      BBMASK += "meta-intel/recipes-selftest/images/secure-boot-selftest-image-unsigned.bb"
      OE_TERMINAL = "screen"

core:
  layers:
    - core
  conf: |
    #DISTRO = "poky"
    DISTRO = "pixelatedrailroad"
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " pam wayland systemd"
    CORE_IMAGE_EXTRA_INSTALL:append = " openssh-sshd iproute2"
    IMAGE_FSTYPES:append = " wic.bz2 wic.bmap "
    # Set to use more or less CPU threads for building.
    BB_NUMBER_THREADS = "20"
    PARALLEL_MAKE = "-j 20"
    # whisk will automatically BBMASK layers in any submod present but not in the above layers
    # silence warning about no .bb files present
    BBFILE_PATTERN_IGNORE_EMPTY_meta-raspberrypi-tcook = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_swupdate = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_tpm-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_meta-python = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_security = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_secure-core = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_tpm2 = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_webserver = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_perl-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_openembedded-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_networking-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_filesystems-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_intel = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_raspberrypi = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_efibootguard = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_meta-arm = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_arm-toolchain = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_openamp-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_virtualization-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_parsec-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_integrity = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_harden-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_signing-key = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_ids = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_encrypted-storage = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_efi-secure-boot = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_multimedia-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_meta-initramfs = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_gnome-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_clang-layer = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_whisk = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_lts-u-boot-mixin = "1"
    BBFILE_PATTERN_IGNORE_EMPTY_meta-tcook-common = "1"

# Defines the specific Raspberry Pi target hardware
products:
    pr-raspberrypi0:
      description: "Raspberry Pi 0 W2 64-bit Target"
      default_version: scarthgap
      layers:
        - core
        - oe
        - clang
        - raspberrypi
        - arm
        - secure-core
        - security
        - swupdate
        - mixins
        - tcook-raspberrypi
        - tcook-common
      targets:
        - mc:product-pr-raspberrypi0:core-image-full-cmdline
      conf: |
        DISTRO = "poky"
        MACHINE = "raspberrypi0-2w-64"
        SWVERSION = "${RPI0_VERSION}"
        PREFERRED_PROVIDER_virtual/psplash = "plymouth"
        SPLASH = "plymouth"
        RM_WORK_EXCLUDE += " core-image-full-cmdline"

    pr-raspberrypi3:
      description: "Raspberry Pi 3B 64-bit Target"
      default_version: scarthgap
      layers:
        - core
        - oe
